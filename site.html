function initAI(){
  if(activeTimer){clearInterval(activeTimer);activeTimer=null}
  var f=document.getElementById('chatForm');if(!f)return;
  var history=[],token='',ended=false,userCount=0,started=false;
  var messages=document.getElementById('messages'),timer=document.getElementById('timer'),bar=document.getElementById('bar'),input=document.getElementById('chatInput'),send=document.getElementById('chatSend');
  function bubble(role,text){var row=document.createElement('div');row.className='msg '+(role==='user'?'user':'bot');var who=document.createElement('div');who.className='who';who.textContent=role==='user'?'أنت':'3bkarino AI';var b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(who,b);messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
  bubble('assistant','أهلًا بيك 👋 عندنا أقل من دقيقة أفهم فيها طلبك. ابدأ بنوع نشاطك وإيه النتيجة اللي عايز توصل لها؟');
  async function startSession(){if(started)return true;try{var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start'})});var d=await r.json();if(!r.ok||!d.sessionToken)throw Error('start');token=d.sessionToken;started=true;var start=Date.now();activeTimer=setInterval(function(){if(ended)return;var elapsed=(Date.now()-start)/1000,left=Math.max(0,60-Math.floor(elapsed));timer.textContent='00:'+String(left).padStart(2,'0');bar.style.width=Math.max(0,(left/60)*100)+'%';timer.classList.toggle('warn',left<=15&&left>0);if(left<=0)finish('timeout')},400);return true}catch(e){bubble('assistant','حصلت مشكلة في بدء الجلسة. تقدر تكمل مباشرة على واتساب.');return false}}
  async function finish(reason){if(ended)return;ended=true;if(activeTimer){clearInterval(activeTimer);activeTimer=null}timer.textContent='انتهى';timer.className='timer done';bar.style.width='0%';input.disabled=true;send.disabled=true;
    try{var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'handoff',sessionToken:token,messages:history,reason:reason})});var d=await r.json();if(!r.ok)throw Error('handoff');document.getElementById('handoffSummary').textContent='الخدمة المقترحة: '+d.suggestedService+' | السعر المبدئي: '+d.priceRange+(d.missing&&d.missing.length?' | نحتاج نأكد: '+d.missing.join('، '):'');var url='https://wa.me/'+WA+'?text='+encodeURIComponent(d.whatsappMessage);var wa=document.getElementById('handoffWa');wa.href=url;document.getElementById('handoff').classList.add('show');document.getElementById('handoff').scrollIntoView({behavior:'smooth',block:'center'});var sec=4;document.getElementById('redirect').textContent='جاري فتح واتساب خلال '+sec+' ثواني...';var rd=setInterval(function(){sec--;if(sec<=0){clearInterval(rd);location.href=url}else document.getElementById('redirect').textContent='جاري فتح واتساب خلال '+sec+' ثواني...'},1000)}
    catch(e){var raw=history.map(function(x){return (x.role==='user'?'العميل: ':'المستشار: ')+x.content}).join('\n');var url='https://wa.me/'+WA+'?text='+encodeURIComponent('طلب جديد من مستشار 3bkarino Tech\n\n'+raw);document.getElementById('handoffSummary').textContent='تم تجهيز المحادثة للمتابعة.';document.getElementById('handoffWa').href=url;document.getElementById('handoff').classList.add('show')}
  }
  f.onsubmit=async function(e){e.preventDefault();if(ended)return;var t=input.value.trim();if(!t)return;var ok=await startSession();if(!ok)return;history.push({role:'user',content:t});userCount++;bubble('user',t);input.value='';send.disabled=true;
    try{var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',sessionToken:token,messages:history})});var d=await r.json();if(!r.ok)throw Error('chat');if(d.forceHandoff)return finish(d.reason||'qualified');if(d.reply){history.push({role:'assistant',content:d.reply});bubble('assistant',d.reply)}if(userCount>=4)finish('message-limit')}
    catch(e){if(!ended)bubble('assistant','قولّي ميزانيتك وموعد التنفيذ التقريبي لو معروفين، وبعدها نكمل على واتساب.')}
    finally{if(!ended)send.disabled=false}
  }
}
function initRecordsAdmin(){
  if(location.pathname!=='/admin/records')return;
  var keyInput=document.getElementById('recordsKey'),loadBtn=document.getElementById('recordsLoad'),panel=document.getElementById('recordsPanel'),err=document.getElementById('recordsError');
  if(!keyInput||!loadBtn)return;
  var saved=sessionStorage.getItem('3bk-records-key')||'';if(saved)keyInput.value=saved;
  function val(v){return esc(String(v==null?'':v))}
  function statusOptions(current){
    var opts=[['new','جديد'],['contacted','تم التواصل'],['qualified','مؤهل'],['pending_payment','انتظار دفع'],['paid','مدفوع'],['won','تم البيع'],['lost','مغلق/مفقود']];
    return opts.map(function(o){return '<option value="'+o[0]+'" '+(current===o[0]?'selected':'')+'>'+o[1]+'</option>'}).join('');
  }
  async function saveCard(id,card){
    var status=card.querySelector('.record-status').value,notes=card.querySelector('.record-notes').value;
    var r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':keyInput.value},body:JSON.stringify({action:'update',id:id,status:status,notes:notes})});
    if(!r.ok)throw Error('save');
    var b=card.querySelector('.record-save');b.textContent='تم الحفظ ✓';setTimeout(function(){b.textContent='حفظ'},1200);
  }
  function renderRecords(records){
    var total=records.length,newCount=records.filter(function(x){return x.status==='new'}).length,orders=records.filter(function(x){return x.kind==='order'}).length,paid=records.filter(function(x){return x.status==='paid'||x.status==='won'}).length;
    recordsStats.innerHTML='<div class="records-stat"><span>إجمالي Records</span><b>'+total+'</b></div><div class="records-stat"><span>جديد</span><b>'+newCount+'</b></div><div class="records-stat"><span>طلبات كتاب</span><b>'+orders+'</b></div><div class="records-stat"><span>مدفوع / تم البيع</span><b>'+paid+'</b></div>';
    if(!records.length){recordsList.innerHTML='<div class="card">لسه مفيش Records.</div>';return}
    recordsList.innerHTML=records.map(function(r){
      var customer=r.name||'Lead من AI',contact=[r.phone,r.email].filter(Boolean).join(' • '),what=r.productLabel||r.service||r.product||'غير محدد',detail=r.goal||r.summary||'',amount=r.amount?String(r.amount)+' '+(r.currency||'EGP'):(r.priceRange||'');
      return '<article class="record-card" data-id="'+val(r.id)+'"><div class="record-top"><div><span class="eyebrow">'+val(r.source||r.kind)+'</span><h3>'+val(customer)+'</h3><div class="record-meta">'+val(r.id)+' • '+val(new Date(r.createdAt||Date.now()).toLocaleString('ar-EG'))+'</div></div><span class="license-badge">'+val(r.status||'new')+'</span></div><div class="record-grid"><div class="record-box"><b>الطلب</b><br>'+val(what)+(amount?'<br><strong>'+val(amount)+'</strong>':'')+'</div><div class="record-box"><b>التواصل</b><br>'+val(contact||'غير متاح')+'</div></div>'+(detail?'<div class="record-box" style="margin-top:10px">'+val(detail).slice(0,900)+'</div>':'')+'<div class="record-actions"><select class="record-status">'+statusOptions(r.status)+'</select><textarea class="record-notes" rows="2" placeholder="ملاحظات داخلية">'+val(r.notes||'')+'</textarea><button class="btn dark sm record-save" type="button">حفظ</button></div></article>';
    }).join('');
    document.querySelectorAll('.record-card').forEach(function(card){card.querySelector('.record-save').onclick=function(){saveCard(card.dataset.id,card).catch(function(){alert('تعذر حفظ التعديل')})}});
  }
  async function loadRecords(){
    err.textContent='';loadBtn.disabled=true;loadBtn.textContent='جاري التحميل…';
    try{
      var r=await fetch('/api/leads',{headers:{'x-admin-key':keyInput.value}});
      var d=await r.json();if(!r.ok)throw Error('auth');
      sessionStorage.setItem('3bk-records-key',keyInput.value);panel.style.display='block';renderRecords(d.records||[]);
    }catch(e){panel.style.display='none';err.textContent='تعذر فتح اللوحة. راجع مفتاح الإدارة.'}
    finally{loadBtn.disabled=false;loadBtn.textContent='عرض الـRecords'}
  }
  loadBtn.onclick=loadRecords;if(saved)loadRecords();
}
