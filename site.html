function initCalc(){if(!document.getElementById('bud'))return;const ids=['bud','cpc','cv','aov','mar'],v=id=>+document.getElementById(id).value||0;function run(){const b=v('bud'),c=Math.max(v('cpc'),.01),click=b/c,o=click*v('cv')/100,r=o*v('aov'),p=r*v('mar')/100-b;document.getElementById('rc').textContent=Math.round(click);document.getElementById('ro').textContent=o.toFixed(1);document.getElementById('rr').textContent=Math.round(r)+' ج';document.getElementById('rx').textContent=(b?r/b:0).toFixed(2)+'x';document.getElementById('rp').textContent=Math.round(p)+' ج';document.getElementById('ra').textContent=Math.round(o?b/o:0)+' ج'}ids.forEach(id=>document.getElementById(id).oninput=run);run()}
