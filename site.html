function initCalc(){if(!document.getElementById('bud'))return;var ids=['bud','cpc','cv','aov','mar'];function v(id){return +document.getElementById(id).value||0}function run(){var b=v('bud'),c=Math.max(v('cpc'),.01),click=b/c,o=click*v('cv')/100,r=o*v('aov'),p=r*v('mar')/100-b;rc.textContent=Math.round(click);ro.textContent=o.toFixed(1);rr.textContent=Math.round(r)+' ج';rx.textContent=(b?r/b:0).toFixed(2)+'x';rp.textContent=Math.round(p)+' ج';ra.textContent=Math.round(o?b/o:0)+' ج'}ids.forEach(function(id){document.getElementById(id).oninput=run});run()}
